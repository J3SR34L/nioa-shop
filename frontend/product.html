<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NIOA — Product</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .product-detail { max-width: 1000px; margin: 0 auto; padding: 3rem 2.5rem; position: relative; z-index: 1; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-bottom: 2.5rem; cursor: pointer; background: none; border: none; transition: color 0.2s; }
    .back-btn:hover { color: var(--cyan); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
    .detail-img { aspect-ratio: 1; background: linear-gradient(135deg, #090e1e, #0c1226); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 140px; position: relative; overflow: hidden; }
    .detail-img-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(77,240,216,0.08), transparent 70%); }
    .detail-real-img { width: 100%; height: 100%; object-fit: cover; }
    .detail-badge { position: absolute; top: 16px; left: 16px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 12px; }
    .detail-category { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--violet); margin-bottom: 10px; }
    .detail-name { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 1rem; line-height: 1.1; }
    .detail-stars { color: var(--gold); font-size: 14px; letter-spacing: 2px; margin-bottom: 1.5rem; }
    .detail-price { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1.5rem; }
    .detail-price-now { font-family: 'Syne', sans-serif; font-size: 40px; font-weight: 800; color: var(--cyan); }
    .detail-price-was { font-size: 18px; color: var(--muted); text-decoration: line-through; }
    .detail-desc { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 2rem; font-weight: 300; }
    .detail-specs { margin-bottom: 2rem; }
    .specs-title { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text); margin-bottom: 1rem; }
    .spec-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    .spec-item::before { content: '◆'; color: var(--cyan); font-size: 7px; flex-shrink: 0; }
    .detail-buy-btn { width: 100%; padding: 1.1rem; background: linear-gradient(135deg, var(--cyan), var(--violet)); border: none; color: var(--bg); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; margin-bottom: 12px; }
    .detail-buy-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(77,240,216,0.3); }
    .detail-wishlist-btn { width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--border2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
    .detail-wishlist-btn:hover { border-color: var(--violet); color: var(--violet); }
    @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; gap: 2rem; } .product-detail { padding: 2rem 1.25rem; } .detail-name { font-size: 28px; } }
  </style>
</head>
<body>
<div class="space-bg"></div>
<div class="stars" id="stars"></div>

<nav class="nav">
  <div class="nav-logo">NIOA</div>
  <div class="nav-actions">
    <button class="nav-btn" id="login-btn" onclick="loginWithGoogle()">⬡ Login</button>
    <button class="nav-btn" id="cart-btn">◈ Cart <span class="cart-count" id="badge">0</span></button>
  </div>
</nav>

<div class="product-detail">
  <button class="back-btn" onclick="window.location.href='index.html'">← Back to Catalog</button>
  <div class="detail-grid" id="detail-grid">
    <div style="text-align:center;padding:5rem;color:var(--muted);grid-column:1/-1">Loading...</div>
  </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <div class="cart-title">Your Cart</div>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-body" id="cart-body">
    <div class="cart-empty"><div class="cart-empty-icon">◈</div><p>Cart is empty</p></div>
  </div>
  <div class="cart-footer">
    <div class="cart-line"><span class="cl-label">Items</span><span class="cl-val" id="cart-count-label">0</span></div>
    <div class="cart-line"><span class="cl-label">Shipping</span><span class="cl-val cl-free">Free</span></div>
    <div class="cart-divider"></div>
    <div class="cart-total-line"><span class="ctl-label">Total</span><span class="ctl-amount" id="cart-total">$0</span></div>
    <button class="checkout-btn" onclick="checkout()">Initiate Checkout</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o:${0.2+Math.random()*0.6};animation-delay:${Math.random()*4}s`;
    starsEl.appendChild(s);
  }
</script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/product.js"></script>
</body>
</html>
